      const sub = targs[1];
      subkind = sub.t === 'sym' ? sub.s : sub.t === 'kw' ? sub.s : null;
      quoteNode = targs[2];
    } else {
      quoteNode = targs[targs.length - 1];
    }
    // Resolve a sym arg: (tape pat) where pat is bound to a quote node in the env.
    if (quoteNode && quoteNode.t === 'sym') {
      const r = envLookup(env, quoteNode.s);
      if (r.found && r.value && r.value.t === 'quote') quoteNode = r.value;
    }
    const forNotes = subkind === 'notes';
    const rawItems = quoteNode && quoteNode.t === 'quote'
      ? expandQuoteItems(quoteNode, forNotes, env)
      : [expandNode(quoteNode, env, ctx)];

    // When the subkind names a lens/op-lens binding in scope, the seed items are
    // its cell names: resolve each to its index in that binding, NOT through the
    // global env (so an item missing from the binding names the binding, not a
    // bare "unknown name"). Otherwise resolve sym cells (x, ., note names, etc.)
    // through the env so lowerTape receives only num nodes.
    const subBinding = (subkind && !forNotes) ? envLookup(env, subkind) : { found: false };
    let tapeItems;
    if (subBinding.found && (subBinding.value.t === 'lens' || subBinding.value.t === 'oplens')) {
      const cellNames = subBinding.value.names || null;
      if (!cellNames) {
        throw new Error(`tape: subkind "${subkind}" has no cell names; cannot resolve items`);
      }
      if (rawItems.length === 0) {
        throw new Error(`tape: subkind "${subkind}" seed must not be empty`);
      }
      tapeItems = rawItems.map(item => {
        if (item.t === 'num') return item; // numeric literal -> direct index
        const itemName = item.t === 'sym' ? item.s : null;
        if (itemName === null) {
          throw new Error(
            `tape: subkind "${subkind}" seed item must be a sym or number; got "${item.t}"`
          );
        }
        const idx = cellNames.indexOf(itemName);
        if (idx === -1) {
          throw new Error(
            `tape: item "${itemName}" not found in "${subkind}" (cells: ${cellNames.join(', ')})`
          );
        }
        return { t: 'num', v: idx };
      });
    } else if (subBinding.found) {
      throw new Error(
        `tape: subkind "${subkind}" must be a lens or op-lens; got "${subBinding.value.t}"`
      );
    } else {
      // No subkind binding (plain tape, or an intrinsic tag handled elsewhere):
      // resolve seed syms through the env; throw on any that does not resolve.
      tapeItems = rawItems.map(item => {
        if (item.t !== 'sym') return item;
        const r = envLookup(env, item.s);
        if (r.found) return r.value;
        throw new Error(`unknown name: ${item.s}`);
      });
    }

    const result = { t: 'tape', items: tapeItems };
    if (subkind) result.subkind = subkind;
    if (keep) result.keep = true;
    return result;
  }

  if (name === 'audio') {
    const rawArgs = items.slice(1).map(it => expandNode(it, env, ctx));
    const { kwargs } = splitArgs(rawArgs);
    const result = { t: 'audio' };
    if (kwargs.seconds !== undefined) result.seconds = kwargs.seconds;
    if (kwargs.length !== undefined) result.length = kwargs.length;
    return result;
  }

  if (name === 'score') {
    // (score '(NOTE _ ~ NOTE ...)) produces a dual-port object:
    //   :notes  = the pitch sequence; _ and ~ hold the previous note (a v/oct
    //             sequencer is a sample-and-hold, so a rest must not drop the
    //             pitch to 0 = C-1 and pitch-bend the voice's release tail down).
    //   :rhythm = a tape of 0/4095 gates (4095 for actual notes, 0 for _ and ~).
    const q = items[1];
    if (!q || q.t !== 'quote') throw new Error("score: needs a quoted sequence, e.g. (score '(C3 _ E3 ~))");
    const rawItems = expandQuoteItems(q, true, env);
    const rhythm = rawItems.map(it => {
      if (it.t === 'sym' && (it.s === '_' || it.s === '~')) return { t: 'num', v: 0 };
      return { t: 'num', v: 4095 };
    });
    // Carry the last sounded pitch through rests/ties; leading rests hold 0.
    let held = { t: 'num', v: 0 };
    const noteItems = rawItems.map(it => {
      if (it.t === 'sym' && (it.s === '_' || it.s === '~')) return held;
      held = it;
      return it;
    });
    return {
      t: 'outputs',
      ports: [
        { name: 'notes', value: { t: 'tape', subkind: 'notes', items: noteItems } },
        { name: 'rhythm', value: { t: 'tape', subkind: 'rhythm', items: rhythm } },
      ],
    };
  }

  // (normal JACK DEFAULT): the jack when a cable is patched, else the default.
  // Sugar over the `connected` predicate.
  if (name === 'normal') {
    const jack = expandNode(items[1], env, ctx);
    const def_ = expandNode(items[2], env, ctx);
    return { t: 'call', op: 'if',
             args: [{ t: 'connected', jack }, jack, def_],
             kwargs: Object.create(null) };
  }

  // (connected JACK): VMAX if a cable is patched into JACK, else 0.
  if (name === 'connected') {
    return { t: 'connected', jack: expandNode(items[1], env, ctx) };
  }

  if (name === 'morph') {
    return { t: 'morph', args: items.slice(1).map(it => expandNode(it, env, ctx)) };
  }

  if (name === 'feedback') {
    throw new Error('no feedback form: a name referenced in its own def is a one-sample feedback, e.g. (def y (add y (mul k (sub x y))))');
  }

  if (name === 'z1') {
    return { t: 'z1', x: expandNode(items[1], env, ctx) };
  }

  // hold -- a sample & hold. Two shapes, told apart by whether it carries a clock:
  //   (hold VAL ON) | (hold VAL :on ON)     level S&H (op_hold): track VAL while ON
  //   (hold NAME NEXT :trig C | :per-sample [:init V])   a register/fold: NAME reads
  //       the held value, NEXT is stored each clock edge (or sample). NEXT may use
  //       NAME for feedback (counters, accumulators).
  //   (hold VAL :trig C | :per-sample [:init V])         edge/per-sample S&H of VAL.
  // The register desugars to a one-cell tape read by lookup (no head dependency, so
  // the feedback is a clean one-sample z-1) plus a recordhead write.
  if (name === 'hold') {
    const raw = items.slice(1);
    const pos = [];
    const kw = Object.create(null);
    for (let i = 0; i < raw.length; i++) {
      const it = raw[i];
      if (it && it.t === 'kw') {
        if (it.s === 'per-sample') kw['per-sample'] = true;
        else { kw[it.s] = raw[i + 1]; i++; }
      } else pos.push(it);
    }
    const hasClock = kw.trig !== undefined || kw['per-sample'];
    if (!hasClock) {
      // Level sample & hold: track the value while the gate is high.
      const gate = pos.length >= 2 ? pos[1] : kw.on;
      if (!gate) throw new Error('hold: level S&H needs a gate, e.g. (hold v g) or (hold v :on g)');
      return { t: 'call', op: 'hold',
        args: [expandNode(pos[0], env, ctx), expandNode(gate, env, ctx)],
        kwargs: Object.create(null) };
    }
    const initNode = kw.init !== undefined ? expandNode(kw.init, env, ctx) : null;
    if (initNode && initNode.t !== 'num')
      throw new Error('hold: :init must resolve to a constant number');
    const initVal = initNode ? initNode.v : 0;
    const cellNode = { t: 'tape', items: [{ t: 'num', v: initVal }] };
    const readNode = { t: 'call', op: 'lookup', args: [cellNode, { t: 'num', v: 0 }], kwargs: Object.create(null) };
    let valueNode;
    if (pos.length >= 2) {
      // (hold NAME NEXT ...): bind NAME to the held value, then expand NEXT.
      if (pos[0].t !== 'sym') throw new Error('hold: register form needs a name first, e.g. (hold count (add count 1) :trig clk)');
      const childEnv = makeEnv(env);
      envBind(childEnv, pos[0].s, readNode);
      valueNode = expandNode(pos[1], childEnv, ctx);
    } else {
      valueNode = expandNode(pos[0], env, ctx);   // sample an external value, no feedback
    }
    const cableKwargs = Object.create(null);
    if (kw.trig !== undefined) cableKwargs.trig = expandNode(kw.trig, env, ctx);
    else cableKwargs['per-sample'] = { t: 'flag' };
    ctx.localCables.push({ sink: cellNode, value: valueNode, kwargs: cableKwargs });
    return readNode;
  }

  if (name === 'outputs') {
    const ports = items.slice(1).map(it => {
      if (it.t === 'list' && it.items.length >= 2) {
        const portName = it.items[0].s || '?';
        const value = expandNode(it.items[1], env, ctx);
        return { name: portName, value };
      }
      return { name: '?', value: expandNode(it, env, ctx) };
    });
    return { t: 'outputs', ports };
  }

  // (len LIST): a static lens/oplens/quote folds to its cell count at compile time
  // (squint needs this to spread the selector across the list length).
  if (name === 'len' && items.length === 2) {
    const arg = expandNode(items[1], env, ctx);
    if (arg && arg.t === 'lens')   return { t: 'num', v: arg.items.length };
    if (arg && arg.t === 'oplens') return { t: 'num', v: arg.cells.length };
    if (arg && arg.t === 'quote')  return { t: 'num', v: arg.items.length };
    if (arg && arg.t === 'num')    return { t: 'num', v: 1 }; // scalar = length-1
    // Dynamic tape: fall through to the op_len primitive path.
  }

  // (thru LIST IDX): positional. LIST first, index second. Out-of-range wraps.
  // A value cell IS the value; an op-lens cell is selected here and applied via
  // ((thru ops IDX) X) (handled in the non-sym-head path above).
  if (name === 'thru') {
    const listNode = expandNode(items[1], env, ctx);
    // A scalar is a length-1 collection: any index wraps to it.
    if (listNode && listNode.t === 'num') return listNode;
    const listResolved = resolveThruList(listNode, env, ctx);
    const atArg = items[2] !== undefined ? expandNode(items[2], env, ctx) : { t: 'num', v: 0 };
    return buildThru(listResolved, atArg);
  }

  // sel: select the second output of a stereo/multi-output node, or pass through
  // a cable-ref (write-head position) unchanged. Equivalent to (thru X 1) for
  // value nodes; for cable-ref nodes the ref itself IS the head position.
  if (name === 'sel') {
    let arg = expandNode(items[1], env, ctx);
    if (!arg) return { t: 'num', v: 0 };
    // Unwrap a ref placeholder (set by expandPatchBody's prescan) to its inner value.
    if (arg.t === 'ref') arg = arg.value || { t: 'num', v: 0 };
    if (arg.t === 'cable-ref') return arg; // head-pos reference from (def name (<- buf ...))
    if (arg.t === 'outputs') {
      // Multi-output node (echo/reverb/chorus/flanger): port 1 = right channel.
      return arg.ports[1] ? arg.ports[1].value : arg;
    }
    const listResolved = resolveThruList(arg, env, ctx);
    return buildThru(listResolved, { t: 'num', v: 1 });
  }

  // def is handled by body processors but can appear as a raw node in fn bodies.
  if (name === 'def') return node;

  // <- is a statement, not a value: it defines an output on its own line. Nested
  // in an expression the write was silently dropped, so reject it and point at
  // the idiom: name the signal with def, then write it.
  if (name === '<-') {
    throw new Error(
      '<- cannot be nested inside an expression; it writes a destination on its own line. ' +
      'Name the signal with def and reference it, e.g. (def x SRC) then (<- DEST x).');
  }

  // --- function call or unknown op ---

  const headResolved = envLookup(env, name);

  if (headResolved.found) {
    let fnNode = headResolved.value;
    if (fnNode && fnNode.t === 'ref' && fnNode.value != null) {
      fnNode = fnNode.value;
    }

    if (fnNode && fnNode.t === 'fn') {
      if (fnNode.primitive) {
        // Primitive op (defined in prelude but implemented in runtime): emit call node.
        const rawArgs = items.slice(1).map(it => expandNode(it, env, ctx));
        const { positional, kwargs } = splitArgs(rawArgs);
        if (CLK_OPS.has(name) && !kwargs.trig && !kwargs.hz && !kwargs.bpm) {
          const masterR = envLookup(env, 'master');
          if (masterR.found) kwargs.trig = masterR.value;
        }

        // groove: each drum voice's :on tape becomes a :trig (hits on-tape clk),
        // and groove is the mix of the voices.
        if (name === 'groove') {
          const clkNode = kwargs.trig;
          if (clkNode) {
            for (const voiceArg of positional) {
              if (voiceArg.t === 'call' && voiceArg.kwargs && voiceArg.kwargs.on) {
                const onVal = voiceArg.kwargs.on;
                if (onVal.t === 'tape' || onVal.t === 'quote') {
                  const hitsCall = { t: 'call', op: 'hits', args: [onVal], kwargs: { trig: clkNode } };
                  const rest = Object.create(null);
                  for (const [k, v] of Object.entries(voiceArg.kwargs)) {
                    if (k !== 'on') rest[k] = v;
                  }
                  voiceArg.kwargs = Object.assign(Object.create(null), { trig: hitsCall }, rest);
                }
              }
            }
          }
          return { t: 'call', op: 'mix', args: positional, kwargs: Object.create(null) };
        }

        // A tape argument selected at runtime from a lens of tapes: distribute
        // this op over each tape and pick the result value at the selection index.
        const distributed = distributeBufLensSel(name, positional, kwargs, ctx);
        if (distributed) return distributed;

        // Primitive fn with named outputs: return an outputs node so port selection works.
        // SPEC: each port gets its own call node with :port baked in; lowerer emits one slot each.
        const outputs = fnNode.params && fnNode.params.outputs;
        if (outputs && outputs.length > 0) {
          // An explicit :port (a name like :port hp, or a number) selects that one
          // output directly -- sugar for port-select ((op ..) :hp).
          if (kwargs.port) {
            const pi = kwargs.port.t === 'num' ? kwargs.port.v
                     : kwargs.port.t === 'sym' ? outputs.indexOf(kwargs.port.s) : -1;
            if (pi >= 0 && pi < outputs.length) {
              const pk = Object.assign({}, kwargs, { port: { t: 'num', v: pi } });
              return { t: 'call', op: name, args: positional, kwargs: pk };
            }
          }
          const ports = outputs.map((portName, i) => {
            const portKwargs = Object.assign({}, kwargs, { port: { t: 'num', v: i } });
            // The port clones SHARE the positional array: the lowerer keys one
            // kernel instance for all ports on that identity (stereoFxMemo).
            return { name: portName, value: { t: 'call', op: name, args: positional, kwargs: portKwargs } };
          });
          return { t: 'outputs', ports };
        }
        return { t: 'call', op: name, args: positional, kwargs,
                 sig: (fnNode.params && fnNode.params.inputs) || undefined };
      }
      return expandFnCall(name, fnNode, items.slice(1), env, ctx);
    }

    if (fnNode && fnNode.t === 'outputs') {
      return expandPortSelect(fnNode, items.slice(1), env, ctx);
    }

    // A tape/audio buffer applied to an index reads that cell: (t i) -> (lookup t i).
    // A tape is a function of its index; this is the legible form of (lookup t i).
    if (fnNode && (fnNode.t === 'tape' || fnNode.t === 'audio') && items.length > 1) {
      const argItems = items.slice(1).map(it => it.t === 'kw' ? it : expandNode(it, env, ctx));
      const { positional, kwargs } = splitArgs(argItems);
      if (positional.length >= 1)
        return { t: 'call', op: 'lookup', args: [fnNode, positional[0]], kwargs };
    }

    // The resolved value is some other node (tape, lens, num, etc.) used as
    // a positional -- caller is doing something like (step rungle) where rungle
    // is a tape node. We resolve the name; the surrounding call handles the node.
    // This shouldn't reach here as call-head... but handle gracefully.
    return fnNode;
  }

  // Unknown op.
  const rawArgs = items.slice(1).map(it => expandNode(it, env, ctx));
  const { positional, kwargs } = splitArgs(rawArgs);
  report.unknownOps.add(name);
  return { t: 'call', op: name, args: positional, kwargs };
}

function expandPortSelect(outputsNode, argItems, env, ctx) {
  if (argItems.length === 1 && argItems[0].t === 'kw') {
    const portName = argItems[0].s;
    const port = outputsNode.ports.find(p => p.name === portName);
    if (port) return port.value;
  }
  return outputsNode;
}

// True when a name is bound in THIS frame (not an outer env).
function boundHere(frame, name) {
  return Object.prototype.hasOwnProperty.call(frame.bindings, name);
}

// Expand a fn call by inlining the body.
function expandFnCall(opName, fnNode, argItems, callEnv, ctx) {
  const rawArgs = argItems.map(it => expandNode(it, callEnv, ctx));
  const { positional, kwargs } = splitArgs(rawArgs);
  const { inputs, outputs } = fnNode.params;

  // New frame extends fn.env (def-site) with params bound to call-site values.
  const callFrame = makeEnv(fnNode.env);

  for (let i = 0; i < inputs.length; i++) {
    if (i < positional.length) {
      envBind(callFrame, inputs[i], positional[i]);
    }
    // Unbound positionals fall through to fn.env / prelude at lookup time.
  }

  // Bind kwargs into the call frame so fn body can reference them.
  for (const [k, v] of Object.entries(kwargs)) {
    envBind(callFrame, k, v);
  }

  // Unbound params with declared defaults resolve in the fn's DEFINITION env
  // (the library, not the caller), expanded per call for per-instance state.
  const defaults = fnNode.params.defaults || {};
  for (const name of inputs) {
    if (boundHere(callFrame, name)) continue;
    if (defaults[name] !== undefined) {
      envBind(callFrame, name, expandNode(defaults[name], fnNode.env, ctx));
    }
  }

  // Named outputs -> multi-output expansion.
  if (outputs.length > 0) {
    return expandFnBodyMulti(fnNode.body, callFrame, outputs, ctx);
  }

  return expandFnBodySingle(fnNode.body, callFrame, ctx);
}

// Expand a fn body with named output ports.
// (on CLK [:when G] FORM...): a timing region. Contained (<- ...) writes default to
// :trig CLK and :when G; contained defs bind normally. Returns the cables so each
// caller (patch body / fn body) files them where it keeps cables.
function expandOnRegion(form, env, ctx) {
  const inner = form.items.slice(1);
  const ambient = { trig: expandNode(inner[0], env, ctx), when: null };
  const cables = [];

  for (let i = 1; i < inner.length; i++) {
    const it = inner[i];
    if (it && it.t === 'list') {
      const h = it.items[0] && it.items[0].t === 'sym' ? it.items[0].s : null;
      if (h === 'def') {
        const target = it.items[1];
        if (target && target.t === 'sym') {
          envBind(env, target.s, { t: 'ref', s: target.s, value: null });
        }
      }
    }
  }

  for (let i = 1; i < inner.length; i++) {
    const it = inner[i];
    if (it && it.t === 'kw') {
      if (it.s === 'when') { ambient.when = expandNode(inner[i + 1], env, ctx); i++; }
    } else if (it && it.t === 'list') {
      const h = it.items[0] && it.items[0].t === 'sym' ? it.items[0].s : null;
      if (h === 'def') {
        const target = it.items[1];
        if (target && target.t === 'sym') {
          const val = expandNode(it.items[2], env, ctx);
          const r = envLookup(env, target.s);
          if (r.found && r.value && r.value.t === 'ref') {
            r.value.value = val;
          } else {
            envBind(env, target.s, val);
          }
        } else {
          bindDef(it, env, ctx);
        }
      }
      else if (h === '<-') cables.push(expandCableForm(it, env, ctx, ambient));
    }
  }
  return cables;
}

function expandFnBodyMulti(bodyForms, env, outputNames, ctx) {
  const localEnv = makeEnv(env);
  prescanDefNames(bodyForms, localEnv);
  const ports = [];

  for (const form of bodyForms) {
    if (form.t === 'list' && form.items[0] && form.items[0].t === 'sym' && form.items[0].s === 'def') {
      const target = form.items[1];
      if (target && target.t === 'sym') {
        envBind(localEnv, target.s, { t: 'ref', s: target.s, value: null });
      }
    }
  }

  for (const form of bodyForms) {
    if (form.t === 'list' && form.items[0] && form.items[0].t === 'sym') {
      const h = form.items[0].s;
      if (h === 'def') {
        const target = form.items[1];
        if (target && target.t === 'sym') {
          const val = expandNode(form.items[2], localEnv, ctx);
          const r = envLookup(localEnv, target.s);
          if (r.found && r.value && r.value.t === 'ref') {
            r.value.value = val;
          } else {
            envBind(localEnv, target.s, val);
          }
        } else {
          bindDef(form, localEnv, ctx);
        }
        continue;
      }
      if (h === '<-') {
        // (<- PORTNAME VALUE ...) inside fn body
        const sinkSym = form.items[1];
        const cable = expandCableForm(form, localEnv, ctx);
        if (sinkSym && sinkSym.t === 'sym' && outputNames.includes(sinkSym.s)) {
          ports.push({ name: sinkSym.s, value: cable.value });
        } else {
          // Genuine local cables (tape/buffer writes) get lowered; output-port
          // bindings do not (the value flows through the returned port).
          ctx.localCables.push(cable);
        }
        continue;
      }
      if (h === 'on') {
        for (const c of expandOnRegion(form, localEnv, ctx)) ctx.localCables.push(c);
        continue;
      }
    }
    // Meta kw pairs at the top of fn body -- skip.
    if (form.t === 'kw') continue;
    expandNode(form, localEnv, ctx);
  }

  return { t: 'outputs', ports };
}

// Expand a fn body and return the last expression.
function expandFnBodySingle(bodyForms, env, ctx) {
  const localEnv = makeEnv(env);
  prescanDefNames(bodyForms, localEnv);
  let last = { t: 'num', v: 0 };

  for (const form of bodyForms) {
    if (form.t === 'list' && form.items[0] && form.items[0].t === 'sym' && form.items[0].s === 'def') {
      const target = form.items[1];
      if (target && target.t === 'sym') {
        envBind(localEnv, target.s, { t: 'ref', s: target.s, value: null });
      }
    }
  }

  for (const form of bodyForms) {
    if (form.t === 'kw') continue; // meta
    if (form.t === 'list' && form.items[0] && form.items[0].t === 'sym') {
      const h = form.items[0].s;
      if (h === 'def') {
        const target = form.items[1];
        if (target && target.t === 'sym') {
          const val = expandNode(form.items[2], localEnv, ctx);
          const r = envLookup(localEnv, target.s);
          if (r.found && r.value && r.value.t === 'ref') {
            r.value.value = val;
          } else {
            envBind(localEnv, target.s, val);
          }
        } else {
          bindDef(form, localEnv, ctx);
        }
        continue;
      }
      if (h === '<-') {
        const cable = expandCableForm(form, localEnv, ctx);
        ctx.localCables.push(cable);
        continue;
      }
      if (h === 'on') {
        for (const c of expandOnRegion(form, localEnv, ctx)) ctx.localCables.push(c);
        continue;
      }
    }
    last = expandNode(form, localEnv, ctx);
  }

  return last;
}

function expandCableForm(form, env, ctx, ambient) {
  const items = form.items; // [<-, SINK, args...]
  const sinkNode = items[1];

  // Split cable args into stage forms (positional) and cable-level kwargs.
  // Positional stages thread right-to-left into one nested signal form, which
  // then expands through the normal path; a single stage passes through.
  const rawSplit = splitArgs(items.slice(2));
  let valueForm;
  if (rawSplit.positional.length === 0)      valueForm = { t: 'num', v: 0 };
  else if (rawSplit.positional.length === 1) valueForm = rawSplit.positional[0];
  else                                       valueForm = threadStages(rawSplit.positional);
  const value = expandNode(valueForm, env, ctx);

  const kwargs = Object.create(null);
  for (const [k, v] of Object.entries(rawSplit.kwargs)) {
    kwargs[k] = (v && v.t === 'flag') ? v : expandNode(v, env, ctx);
  }

      if (scaleNode && scaleNode.t === 'num') {
        mask = scaleNode.v & 0xFFF;
      } else if (scaleNode && Array.isArray(scaleNode.items)) {
        for (const item of scaleNode.items) {
          if (item.t === 'num') mask |= 1 << (((item.v % 12) + 12) % 12);
        }
      }
      if (mask) return allocSlot('op_snap', [noteRef], { param0: mask }, { state: [] });
      // mask 0 (dynamic or empty scale): fall through to generic path.
    }
    // (mix a b c ...): equal-weight average by default; :levels '(w0 w1 ...) for a
    // custom weighting. Both normalise to the weight sum and expand to a sum of
    // vca'd inputs (no kernel), so N inputs mix at 1/N each and the output stays
    // bounded. Two inputs without :levels fall through to op_mix2 (a 50/50 average).
    if (op === 'mix') {
      const hasLevels = kwargs.levels &&
        (kwargs.levels.t === 'quote' || kwargs.levels.t === 'list');
      if (hasLevels || args.length > 2) {
        const inputs = args.map(lowerNode);
        let ws;
        if (hasLevels) {
          ws = kwargs.levels.items.map(it => (it.t === 'num' ? it.v : 0));
          if (ws.length !== inputs.length) {
            throw new Error(`(mix ... :levels): ${ws.length} levels for ${inputs.length} inputs`);
          }
        } else {
          ws = inputs.map(() => 1);   // equal weights
        }
        const sum = ws.reduce((a, b) => a + b, 0) || 1;
        const scaled = inputs.map((ref, i) =>
          allocSlot('op_vca', [ref, { kind: 'const', value: Math.round(ws[i] * 4095 / sum) }], {}, {}));
        if (scaled.length === 1) return scaled[0];
        return allocSlot('op_add', scaled, {}, {}); // post-pass folds >2 into an add2 tree
      }
    }
    // Variadic ops that chain into binary pairs.
    if (op === 'add' || op === 'mul' || op === 'or' || op === 'and') {
      const positionalInputs = args.map(lowerNode);
      if (positionalInputs.length > 2) {
        return lowerVariadic(op, positionalInputs, kwargs);
      }
    }

    // Table-driven general path: covers all OP_TABLE ops not already handled above.
    if (OP_TABLE[op]) {
      return lowerTableOp(op, OP_TABLE[op], args, kwargs);
    }

    const kernel = chooseKernel(op, kwargs);

    // range: one structural mode word in param0.
    if (op === 'range') {
      const xRef = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      let param0 = 0;
      const tv = kwargs['to-value'], ti = kwargs['to-index'];
      if (tv && tv.t === 'num')      param0 = ((tv.v & 0x3FFFFFFF) | 0x40000000) >>> 0;
      else if (ti && ti.t === 'num') param0 = (ti.v & 0x3FFFFFFF) >>> 0;
      return allocSlot('op_range', [xRef], { param0 }, {});
    }

    // tap: C reads in0=buf, in1=amount, in2=cur_head, param0 bit0 = :span flag.
    // in2 is a placeholder filled by the post-pass with the paired recordhead head.
    if (op === 'tap') {
      const TAP_KWARGS = new Set(['amount', 'span', 'port', 'tape']);
      for (const k of Object.keys(kwargs)) {
        if (!TAP_KWARGS.has(k)) {
          if (k === 'interp')
            throw new Error('(tap ... :interp): gone; tap interpolates under :span automatically');
          throw new Error(`(tap ... :${k}): no such kwarg; tap takes :amount :span`);
        }
      }
      const bufArg    = args[0] !== undefined ? args[0] : kwargs.tape;
      const bufRef    = bufArg !== undefined ? lowerNode(bufArg) : { kind: 'const', value: 0 };
      const amountArg = kwargs.amount !== undefined ? kwargs.amount : args[1];
      const amountRef = amountArg !== undefined ? lowerNode(amountArg) : { kind: 'const', value: 0 };
      const spanFlag  = (kwargs.span && kwargs.span.t === 'flag') ? 1 : 0;
      return allocSlot('op_tap', [bufRef, amountRef, { kind: 'const', value: 0 }], { param0: spanFlag }, {});
    }

    // pluck: Karplus-Strong plucked string. in0=trig, in1=pitch (MIDI), in2=damp,
    // in3=private audio delay line. The buffer must cover the longest period
    // (lowest pitch): 1536 cells ~ MIDI 24 (~32 Hz) at 48 kHz.
    if (op === 'pluck') {
      const trigArg  = args[0] !== undefined ? args[0] : kwargs.trig;
      const pitchArg = args[1] !== undefined ? args[1] : kwargs.pitch;
      const dampArg  = args[2] !== undefined ? args[2] : kwargs.damp;
      const trigRef  = trigArg  !== undefined ? lowerNode(trigArg)  : { kind: 'const', value: 0 };
      const pitchRef = pitchArg !== undefined ? lowerNode(pitchArg) : { kind: 'const', value: 60 };
      const dampRef  = dampArg  !== undefined ? lowerNode(dampArg)  : { kind: 'const', value: 2048 };
      const bufRef   = allocBuffer('audio', 1536);
      return allocSlot('op_pluck', [trigRef, pitchRef, dampRef, bufRef], { param0: 0 }, {});
    }

    // chorus/flanger: an LFO-swept fractional tap over a private ring, stereo.
    // One kernel instance serves both ports: :l is the value, :r reads the +4
    // second output (value_r).
    if (op === 'chorus' || op === 'flanger') {
      const FX_KWARGS = new Set(['in', 'rate', 'depth', 'fb', 'port']);
      for (const k of Object.keys(kwargs)) {
        if (!FX_KWARGS.has(k))
          throw new Error(`(${op} ... :${k}): no such kwarg; ${op} takes :rate :depth :fb`);
      }
      const chorus   = op === 'chorus';
      const inRef    = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      const rateRef  = kwargs.rate  ? lowerNode(kwargs.rate)  : { kind: 'const', value: chorus ? 100 : 50 };
      const depthRef = kwargs.depth ? lowerNode(kwargs.depth) : { kind: 'const', value: chorus ? 1024 : 512 };
      const fbRef    = kwargs.fb    ? lowerNode(kwargs.fb)    : { kind: 'const', value: chorus ? 1024 : 2048 };

      const memoKey = [inRef, rateRef, depthRef, fbRef].map(r => r.kind + ':' + (r.id ?? r.value ?? '')).join(',');
      let base = stereoFxMemo.get(memoKey);
      if (!base) {
        const bufRef   = allocBuffer('audio', chorus ? 1024 : 512);
        base = allocSlot('op_' + op, [inRef, rateRef, depthRef, fbRef, bufRef], {},
                         { state: ['value_r', 'lfo_phase', 'head'] });
        stereoFxMemo.set(memoKey, base);
      }
      const port = (kwargs.port && kwargs.port.t === 'num') ? kwargs.port.v : 0;
      return port === 1 ? { kind: 'slot', id: base.id, read: 'r' } : base;
    }

    // reverb: Freeverb 6-comb + 2-allpass, stereo (:l/:r ports like chorus).
    // Its ring is int16-addressed: 23838 packed cells' bytes cover 17878 int16s.
    // Heavy by design: ~2060 cycles/sample and ~36 KB of the audio pool; the
    // scheduler's budget warning names the patch that overspends.
    if (op === 'reverb') {
      const RV_KWARGS = new Set(['in', 'decay', 'mix', 'port']);
      for (const k of Object.keys(kwargs)) {
        if (!RV_KWARGS.has(k))
          throw new Error(`(reverb ... :${k}): no such kwarg; reverb takes :decay :mix`);
      }
      const inRef    = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      const decayRef = kwargs.decay ? lowerNode(kwargs.decay) : { kind: 'const', value: 2048 };
      const mixRef   = kwargs.mix   ? lowerNode(kwargs.mix)   : { kind: 'const', value: 1024 };

      const memoKey = [inRef, decayRef, mixRef].map(r => r.kind + ':' + (r.id ?? r.value ?? '')).join(',');
      let base = stereoFxMemo.get(memoKey);
      if (!base) {
        const bufRef   = allocBuffer('audio', 23838);
        base = allocSlot('op_reverb', [inRef, decayRef, mixRef, bufRef], {},
                         { state: ['value_r', 'combs', 'allpasses', 'dc'] });
        stereoFxMemo.set(memoKey, base);
      }
      const port = (kwargs.port && kwargs.port.t === 'num') ? kwargs.port.v : 0;
      return port === 1 ? { kind: 'slot', id: base.id, read: 'r' } : base;
    }

    // echo: a stereo delay unit (mono/stereo/ping-pong), ports :l/:r like
    // chorus. A sealed appliance: its ring is private (explicit :seconds, no
    // tape identity); patchable delay memory is the buffer+tap composition.
    if (op === 'echo') {
      const ECHO_KWARGS = new Set(['in', 'in-r', 'time', 'fb', 'mono', 'stereo', 'ping-pong', 'ratio', 'seconds', 'port']);
      for (const k of Object.keys(kwargs)) {
        if (!ECHO_KWARGS.has(k))
          throw new Error(`(echo ... :${k}): no such kwarg; echo takes :in-r :time :fb :mono|:stereo|:ping-pong :ratio :seconds`);
      }
      const inLRef = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      const inRRef = kwargs['in-r'] ? lowerNode(kwargs['in-r']) : inLRef;
      const timeRef = kwargs.time ? lowerNode(kwargs.time) : { kind: 'const', value: 2048 };
      const fbRef   = kwargs.fb   ? lowerNode(kwargs.fb)   : { kind: 'const', value: 1024 };

      const memoKey = [inLRef, inRRef, timeRef, fbRef].map(r => r.kind + ':' + (r.id ?? r.value ?? '')).join(',');
      let base = stereoFxMemo.get(memoKey);
      if (!base) {
        // mode is a flag, like (knob :x :detent): :mono | :stereo | :ping-pong
        const modeFlags = ['mono', 'stereo', 'ping-pong'].filter(m => m in kwargs);
        if (modeFlags.length > 1)
          throw new Error(`(echo :${modeFlags.join(' :')}): pick one of :mono :stereo :ping-pong`);
        const mode = { mono: 0, stereo: 1, 'ping-pong': 2 }[modeFlags[0] ?? 'stereo'];
        let ratio = 2048; // Q11, 1.0 = equal sides
        if (kwargs.ratio !== undefined) {
          if (kwargs.ratio.t !== 'num') throw new Error('(echo :ratio R): ratio must be a number');
          ratio = Math.max(0, Math.min(4095, Math.round(kwargs.ratio.v * 2048)));
        }
        let seconds = 0.5;
        if (kwargs.seconds !== undefined) {
          if (kwargs.seconds.t !== 'num') throw new Error('(echo :seconds S): seconds must be a number');
          seconds = kwargs.seconds.v;
        }
        const cells = Math.max(2, Math.round(seconds * 48000));
        const bufRef = allocBuffer('audio', cells);
        base = allocSlot('op_echo', [inLRef, inRRef, timeRef, fbRef, bufRef],
                         { param0: (mode | (ratio << 8)) >>> 0 },
                         { state: ['value_r', 'head'] });
        stereoFxMemo.set(memoKey, base);
      }
      const port = (kwargs.port && kwargs.port.t === 'num') ? kwargs.port.v : 0;
      return port === 1 ? { kind: 'slot', id: base.id, read: 'r' } : base;
    }

    // compressor: peak follower + downward gain above :thresh.
    if (op === 'compressor') {
      const COMP_KWARGS = new Set(['in', 'thresh', 'ratio', 'attack', 'release', 'port']);
      for (const k of Object.keys(kwargs)) {
        if (!COMP_KWARGS.has(k))
          throw new Error(`(compressor ... :${k}): no such kwarg; compressor takes :thresh :ratio :attack :release`);
      }
      const r = (kw, dflt) => kwargs[kw] ? lowerNode(kwargs[kw]) : { kind: 'const', value: dflt };
      const inRef = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      return allocSlot('op_compressor',
        [inRef, r('thresh', 3000), r('ratio', 2048), r('attack', 100), r('release', 1000)],
        {}, { state: ['envelope'] });
    }

    // dx: fused DX7 voice from a flash bank. param0 = bank index;
    // in0=decay, in1=note, in2=gate, in3=preset, in4=tone.
    if (op === 'dx') {
      const DX_KWARGS = new Set(['bank', 'preset', 'note', 'gate', 'decay', 'tone', 'port', 'voice']);
      for (const k of Object.keys(kwargs)) {
        if (k === 'midi' || k === 'pitch')
          throw new Error(`(dx :${k} ...): the pitch kwarg is :note`);
        if (!DX_KWARGS.has(k))
          throw new Error(`(dx ... :${k}): no such kwarg; dx takes ${[...DX_KWARGS].filter(x => x !== 'port' && x !== 'voice').map(x => ':' + x).join(' ')}`);
      }
      const bankArg   = kwargs.bank   !== undefined ? kwargs.bank   : undefined;
      const presetArg = kwargs.preset !== undefined ? kwargs.preset : undefined;
      const voiceArg  = kwargs.voice  !== undefined ? kwargs.voice  : undefined;
      const pitchArg  = kwargs.note   !== undefined ? kwargs.note   : undefined;
      const gateArg   = kwargs.gate   !== undefined ? kwargs.gate   : undefined;
      const z = { kind: 'const', value: 0 };
      const pitchRef  = pitchArg  !== undefined ? lowerNode(pitchArg)  : { kind: 'const', value: 69 };
      const gateRef   = gateArg   !== undefined ? lowerNode(gateArg)   : z;
      
      let presetRef;
      let bankIdx   = (bankArg && bankArg.t === 'num') ? bankArg.v : 0;
      if (voiceArg !== undefined) {
        presetRef = lowerNode(voiceArg);
        bankIdx |= 0x8000;
      } else {
        presetRef = presetArg !== undefined ? lowerNode(presetArg) : z;
      }

      const decayArg  = kwargs.decay !== undefined ? kwargs.decay : undefined;
      const toneArg   = kwargs.tone  !== undefined ? kwargs.tone  : undefined;
      const decayRef  = decayArg !== undefined ? lowerNode(decayArg) : { kind: 'const', value: 2048 };
      const toneRef   = toneArg  !== undefined ? lowerNode(toneArg)  : { kind: 'const', value: 2048 };
      return allocSlot('op_dx', [decayRef, pitchRef, gateRef, presetRef, toneRef], { param0: bankIdx }, {});
    }

    // weave: Braids macro oscillator.
    // in0=note, in1=timbre, in2=color, in3=model (0-4095 CV), in4=trig.
    // Model can be a static constant (e.g. :model SNARE) or a live CV signal.
    if (op === 'weave') {
      const WEAVE_KWARGS = new Set(['note', 'timbre', 'color', 'model', 'trig']);
      for (const k of Object.keys(kwargs)) {
        if (!WEAVE_KWARGS.has(k))
          throw new Error(`(weave ... :${k}): no such kwarg; weave takes :note :timbre :color :model :trig`);
      }
      const noteArg   = kwargs.note;
      const timbreArg = kwargs.timbre;
      const colorArg  = kwargs.color;
      const modelArg  = kwargs.model;
      const trigArg   = kwargs.trig;

      const noteRef   = noteArg   !== undefined ? lowerNode(noteArg)   : { kind: 'const', value: 60 };
      const timbreRef = timbreArg !== undefined ? lowerNode(timbreArg) : { kind: 'const', value: 2048 };
      const colorRef  = colorArg  !== undefined ? lowerNode(colorArg)  : { kind: 'const', value: 2048 };
      const trigRef   = trigArg   !== undefined ? lowerNode(trigArg)   : { kind: 'const', value: 0 };

      // Model: static symbol (e.g. SNARE=36) -> center-of-bucket const;
      // live node (sequencer etc.) -> passed through as-is (0-4095 -> 0-47 in DSP).
      const BRAIDS_MODELS = [
        'CSAW', 'MORPH', 'SAW_SQR', 'SIN_TRI', 'BUZZ',
        'SQR_SUB', 'SAW_SUB', 'SQR_SYNC', 'SAW_SYNC',
        'TRP_SAW', 'TRP_SQR', 'TRP_TRI', 'TRP_SIN',
        'TRP_RING', 'SAW_SWRM', 'SAW_COMB', 'TOY',
        'LP_FILT', 'PK_FILT', 'BP_FILT', 'HP_FILT',
        'VOSIM', 'VOWEL', 'VOW_FOF', 'HARMONICS',
        'FM', 'FDBK_FM', 'CHAOS_FM',
        'PLUCKED', 'BOWED', 'BLOWN', 'FLUTED',
        'BELL', 'STR_DRUM', 'KICK', 'CYMBAL', 'SNARE',
        'WAVETABLE', 'WAVE_MAP', 'WAVE_LINE', 'POLY_WAVE',
        'FILT_NOISE', 'TWIN_PEAKS', 'CLK_NOISE', 'GRN_CLOUD', 'PARTICLES',
        'DIGIT_MOD', 'MYSTERY'
      ];
      let modelRef;
      if (!modelArg) {
        modelRef = { kind: 'const', value: 0 };
      } else if (modelArg.t === 'num') {
        if (modelArg.v > 47) {
          modelRef = { kind: 'const', value: modelArg.v };
        } else {
          const idx = Math.max(0, Math.min(47, modelArg.v));
          modelRef = { kind: 'const', value: Math.round(((idx + 0.5) / 48) * 4096) };
        }
      } else if (modelArg.t === 'id') {
        const directIdx = BRAIDS_MODELS.indexOf(modelArg.v);
        if (directIdx !== -1) {
          modelRef = { kind: 'const', value: Math.round(((directIdx + 0.5) / 48) * 4096) };
        } else {
          modelRef = lowerNode(modelArg);
        }
      } else {
        modelRef = lowerNode(modelArg);
      }

      return allocSlot('op_weave', [noteRef, timbreRef, colorRef, modelRef, trigRef], {}, {});
    }

    // wave (wavetable / grain reader): composites a phasor + op_wave from pitch kwargs.
    if (op === 'wave' && !('slots' in kwargs)) {
      if (kwargs.midi || kwargs.pitch)
        throw new Error(`(wave :${kwargs.midi ? 'midi' : 'pitch'} ...): the pitch kwarg is :note`);
      const WAVE_KWARGS = new Set(['note', 'hz', 'rate', 'pos', 'once', 'len', 'port']);
      for (const k of Object.keys(kwargs)) {
        if (!WAVE_KWARGS.has(k))
          throw new Error(`(wave ... :${k}): no such kwarg; wave takes :note :hz :rate :pos :once :len (or :slots for a drumrack)`);
      }
      const bufRef = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      const PITCH = { note: 0, hz: 1, rate: 2 };
      const pk = ['note', 'hz', 'rate'].find(k => k in kwargs);
      let scanRef;
      if (pk) {
        const mode = PITCH[pk] & 3;
        const rateRef = lowerNode(kwargs[pk]);
        const onceRef = kwargs.once ? lowerNode(kwargs.once) : null;
        const base = mode | (onceRef ? 4 : 0);
        const pins = onceRef ? [rateRef, onceRef] : [rateRef];
        let phaseRef = allocSlot('op_phasor', pins, { param0: base }, {}); // :phase ramp
        if (kwargs.len) phaseRef = allocSlot('op_vca', [phaseRef, lowerNode(kwargs.len)], {}, {});
        if (kwargs.pos) phaseRef = allocSlot('op_add', [phaseRef, lowerNode(kwargs.pos)], {}, {});
        scanRef = phaseRef;
      } else {
        scanRef = kwargs.pos ? lowerNode(kwargs.pos) : { kind: 'const', value: 0 };
      }
      return allocSlot('op_wave', [bufRef, scanRef], {}, {});
    }

    // thru (data-lens decode): C reads in0=lens buffer, index from in1 (always).
    if (op === 'thru') {
      const lensRef = kwargs.lens ? lowerNode(kwargs.lens)
                    : (args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 });
      const atArg = kwargs.at !== undefined ? kwargs.at : args[1];
      const atRef = (atArg !== undefined && atArg.t === 'num')
                  ? { kind: 'const', value: atArg.v & 0xFFF }
                  : (atArg !== undefined ? lowerNode(atArg) : { kind: 'const', value: 0 });
      return allocSlot('op_thru', [lensRef, atRef], {}, {});
    }

    // Oscillators + clock: detect rate kwargs and bake mode bits into param0 low 2 bits.
    // Rate modes: 0=NOTE, 1=HZ, 2=RATE, 3=TEMPO.  in0 carries the rate value.
    const OSC_OPS = new Set(['phasor', 'sine', 'triangle', 'saw', 'square']);
    if (OSC_OPS.has(op)) {
      const RATE_KWARGS = ['note', 'hz', 'rate', 'tempo', 'bpm'];
      // Every kwarg an oscillator accepts; anything else is a loud error rather
      // than a silently dead knob (the pre-2026-07 surface dropped unknowns).
      const OSC_KWARGS = {
        phasor:   new Set([...RATE_KWARGS, 'sync', 'fm']),
        sine:     new Set([...RATE_KWARGS, 'phase', 'cents', 'pm', 'depth', 'fb', 'fm']),
        triangle: new Set([...RATE_KWARGS, 'phase', 'cents', 'fm']),
        saw:      new Set([...RATE_KWARGS, 'phase', 'cents', 'fm']),
        square:   new Set([...RATE_KWARGS, 'phase', 'cents', 'width', 'fm']),
      };
      for (const k of Object.keys(kwargs)) {
        if (k === 'port') continue;   /* expander machinery: multi-output port select */
        if (k === 'midi' || k === 'pitch')
          throw new Error(`(${op} :${k} ...): the pitch kwarg is :note`);
        if (!OSC_KWARGS[op].has(k))
          throw new Error(`(${op} ... :${k}): no such kwarg; ${op} takes ${[...OSC_KWARGS[op]].map(x => ':' + x).join(' ')}`);
      }
      if (kwargs.phase && (kwargs.cents || kwargs.width || kwargs.fm))
        throw new Error(`(${op} :phase ...): an external phase carries its own rate; :cents/:width/:fm do not apply`);
      const found = RATE_KWARGS.filter(k => k in kwargs);
      if (found.length > 1) throw new Error(`ambiguous rate kwargs: ${found.join(', ')}`);

      let mode = 0;      // default NOTE
      const oscPositional = args.map(lowerNode);
      let rateRef = (oscPositional.length >= 1)
        ? oscPositional[0]
        : { kind: 'const', value: 69 };

      if (found.length === 1) {
        const kw = found[0];
        const val = kwargs[kw];
        if (kw === 'note' || kw === 'midi') {
          mode = 0;
          rateRef = lowerNode(val);
        } else if (kw === 'hz') {
          if (val.t === 'num' && !(Number.isInteger(val.v) && val.v >= 1)) {
            mode = 2;
            rateRef = { kind: 'const', value: hzToRateCode(val.v) };
          } else {
            mode = 1;
            rateRef = lowerNode(val);
          }
        } else if (kw === 'rate') {
          mode = 2;
          rateRef = lowerNode(val);
        } else if (kw === 'tempo') {
          mode = 3;
          rateRef = lowerNode(val);
        } else if (kw === 'bpm') {
          if (val.t === 'num') {
            const hz = val.v / 60;
            if (Number.isInteger(hz) && hz >= 1) {
              mode = 1;
              rateRef = { kind: 'const', value: hz };
            } else {
              mode = 2;
              rateRef = { kind: 'const', value: hzToRateCode(hz) };
            }
          } else {
            // Stream BPM in HZ mode resolves to whole Hz (rounded): 60-BPM steps.
            // A finer stream rate needs the phasor rate model (clock :tempo covers
            // the knob case); see attic/specs/next-phase-plan.md stage 5.
            mode = 1;
            const bpmRef = lowerNode(val);
            const halfRef = allocSlot('op_add', [bpmRef, { kind: 'const', value: 30 }], {}, {});
            rateRef = allocSlot('op_div', [halfRef, { kind: 'const', value: 60 }], {}, {});
          }
        }
      }

      // :fm, the second frequency input: added to the rate in the carrier's
      // domain (:note = exponential/v-oct FM, :hz = linear FM). Attenuate the
      // signal yourself, as at a module's FM jack: :fm (vca mod idx).
      if (kwargs.fm) {
        rateRef = allocSlot('op_add', [rateRef, lowerNode(kwargs.fm)], {}, {});
      }

      // :phase drives the shaper from an external phase (e.g. a phasor ramp) instead of
      // the internal accumulator (param0 bit 4). The rate/pitch is then ignored.
      const phaseRef = kwargs.phase ? lowerNode(kwargs.phase) : null;
      // :cents fine detune (param0 bit 6): VMID centre, +-100 cents full scale.
      const centsRef = kwargs.cents ? lowerNode(kwargs.cents) : null;

      if (op === 'sine') {
        // sine: param0 encodes mode (bits 1..0), PM present (bit 2), depth present (bit 3),
        // phase-driven (bit 4), self-feedback present (bit 5), cents present (bit 6).
        // Inputs: in0 = phase/rate, in1 = pm, in2 = depth, in3 = fb, in4 = cents. Optional
        // inputs that precede a present one are padded with a const 0 to keep slot order.
        const pmRef    = kwargs.pm    ? lowerNode(kwargs.pm)    : null;
        const depthRef = kwargs.depth ? lowerNode(kwargs.depth) : null;
        const fbRef    = kwargs.fb    ? lowerNode(kwargs.fb)    : null;
        let param0 = mode & 3;
        if (phaseRef) param0 |= 16;
        if (pmRef)    param0 |= 4;
        if (depthRef) param0 |= 8;
        if (fbRef)    param0 |= 32;
        if (centsRef) param0 |= 64;
        const z = { kind: 'const', value: 0 };
        const sineIns = [phaseRef || rateRef];
        if (pmRef || depthRef || fbRef || centsRef) sineIns.push(pmRef || z);     // in1
        if (depthRef || fbRef || centsRef)          sineIns.push(depthRef || z);  // in2
        if (fbRef || centsRef)                      sineIns.push(fbRef || z);     // in3
        if (centsRef)                               sineIns.push(centsRef);       // in4
        return allocSlot(kernel, sineIns.slice(0, 5), { param0 }, {});
      }

      // phasor outputs its ramp (the phase). :sync locks to an external pulse.
      if (op === 'phasor') {
        const syncRef = kwargs.sync ? lowerNode(kwargs.sync) : null;
        const lock = syncRef && found.length === 0 && args.length === 0;
        const base = (mode & 3) | (syncRef ? 4 : 0) | (lock ? 8 : 0);
        const pIns = syncRef ? [rateRef, syncRef] : [rateRef];
        return allocSlot('op_phasor', pIns, { param0: base }, {});
      }

      // triangle/saw/square: param0 low 2 bits = mode; in0 = rate value. With :phase,
      // in0 is an external phase (bit 4 set) and the rate is ignored.
      // in1 = cents (bit 6); square only: in2 = pulse width (bit 7, VMID = 50%).
      const widthRef = (op === 'square' && kwargs.width) ? lowerNode(kwargs.width) : null;
      let param0 = phaseRef ? 16 : (mode & 3);
      const ins = [phaseRef || rateRef];
      if (centsRef || widthRef) ins.push(centsRef || { kind: 'const', value: 2048 });
      if (centsRef) param0 |= 64;
      if (widthRef) { param0 |= 128; ins.push(widthRef); }
      return allocSlot(kernel, ins, { param0 }, {});
    }

    if (['step', 'onsets', 'gates', 'hits'].includes(op)) {
      const tapeArg = kwargs.tape !== undefined ? kwargs.tape : args[0];
      const tapeRef = tapeArg !== undefined ? lowerNode(tapeArg) : { kind: 'const', value: 0 };
      const trigArg = kwargs.trig !== undefined ? kwargs.trig : args[1];
      const trigRef = trigArg !== undefined ? lowerNode(trigArg) : { kind: 'const', value: 0 };
      const lenArg  = kwargs.len  !== undefined ? kwargs.len  : args[2];
      const lenRef  = lenArg  !== undefined ? lowerNode(lenArg)  : { kind: 'const', value: 0 };
      return allocSlot('op_' + op, [tapeRef, trigRef, lenRef], {}, {});
    }
    if (op === 'euclid') {
      const pulsesArg = kwargs.pulses !== undefined ? kwargs.pulses : args[0];
      const pulsesRef = pulsesArg !== undefined ? lowerNode(pulsesArg) : { kind: 'const', value: 448 };
      const stepsArg  = kwargs.steps  !== undefined ? kwargs.steps  : args[1];
      const stepsRef  = stepsArg  !== undefined ? lowerNode(stepsArg)  : { kind: 'const', value: 1984 };
      const trigArg   = kwargs.trig   !== undefined ? kwargs.trig   : args[2];
      const trigRef   = trigArg   !== undefined ? lowerNode(trigArg)   : { kind: 'const', value: 0 };
      return allocSlot('op_euclid', [pulsesRef, stepsRef, trigRef], {}, {});
    }
    if (op === 'chance') {
      const probArg = kwargs.prob !== undefined ? kwargs.prob : args[0];
      const probRef = probArg !== undefined ? lowerNode(probArg) : { kind: 'const', value: 2048 };
      const trigArg = kwargs.trig !== undefined ? kwargs.trig : args[1];
      const trigRef = trigArg !== undefined ? lowerNode(trigArg) : { kind: 'const', value: 0 };
      return allocSlot('op_chance', [probRef, trigRef], {}, {});
    }
    if (op === 'random') {
      const trigArg = kwargs.trig !== undefined ? kwargs.trig : args[0];
      const trigRef = trigArg !== undefined ? lowerNode(trigArg) : { kind: 'const', value: 0 };
      return allocSlot('op_random', [trigRef], {}, {});
    }
    if (op === 'counter') {
      const barsArg  = kwargs.bars  !== undefined ? kwargs.bars  : args[0];
      const barsRef  = barsArg  !== undefined ? lowerNode(barsArg)  : { kind: 'const', value: 0 };
      const trigArg  = kwargs.trig  !== undefined ? kwargs.trig  : args[1];
      const trigRef  = trigArg  !== undefined ? lowerNode(trigArg)  : { kind: 'const', value: 0 };
      const resetArg = kwargs.reset !== undefined ? kwargs.reset : args[2];
      const resetRef = resetArg !== undefined ? lowerNode(resetArg) : { kind: 'const', value: 0 };
      return allocSlot('op_counter', [barsRef, trigRef, resetRef], {}, {});
    }
    if (op === 'quantise') {
      const inArg = args[0] !== undefined ? args[0] : kwargs.in;
      const inRef = inArg !== undefined ? lowerNode(inArg) : { kind: 'const', value: 0 };
      const scaleNode = kwargs.scale !== undefined ? kwargs.scale : args[1];
      let mask = 0;
      if (scaleNode && scaleNode.t === 'num') {
        mask = scaleNode.v & 0xFFF;
      } else if (scaleNode && Array.isArray(scaleNode.items)) {
        for (const item of scaleNode.items) {
          if (item.t === 'num') mask |= 1 << (((item.v % 12) + 12) % 12);
        }
      } else if (scaleNode && scaleNode.t === 'sym') {
        const SCALE_MASKS = {
          minor: 1453, major: 2741, 'minor-pent': 1193, 'major-pent': 661,
          dorian: 1709, phrygian: 1451, lydian: 2773, mixolydian: 1717, chromatic: 4095
        };
        mask = SCALE_MASKS[scaleNode.s] || 0;
      }
      if (mask) return allocSlot('op_quantise', [inRef], { param0: mask }, { state: [] });
      const maskRef = scaleNode ? lowerNode(scaleNode) : { kind: 'const', value: 4095 };
      return allocSlot('op_quantise', [inRef, maskRef], {}, { state: [] });
    }
    if (op === 'transpose') {
      const inArg = args[0] !== undefined ? args[0] : kwargs.in;
      const inRef = inArg !== undefined ? lowerNode(inArg) : { kind: 'const', value: 0 };
      const byArg = args[1] !== undefined ? args[1] : kwargs.by;
      const byRef = byArg !== undefined ? lowerNode(byArg) : { kind: 'const', value: 0 };
      return allocSlot('op_transpose', [inRef, byRef], {}, {});
    }

    // Generic fallback for ops not in OP_TABLE and not handled above.
    // Numeric kwargs fold into param0 (sorted by key); dynamic kwargs become extra inputs.
    const ins = args.map(lowerNode);
    const params = {};
    const extraIns = [];

    for (const [k, v] of Object.entries(kwargs)) {
      if (k === 'port') continue;
      if (v.t === 'flag') {
        // Flags go into meta.
      } else if (v.t === 'num') {
        params[k] = v.v;
      } else {
        extraIns.push({ key: k, ref: lowerNode(v) });
      }
    }

    // trig inputs lead so clock-consumers find their clock first.
    const orderedExtras = [
      ...extraIns.filter(e => e.key === 'trig'),
      ...extraIns.filter(e => e.key !== 'trig'),
    ];

    const allIns = [
      ...ins,
      ...orderedExtras.map(e => e.ref),
    ].slice(0, 5);

    const flags = Object.entries(kwargs)
      .filter(([, v]) => v.t === 'flag')
      .map(([k]) => k);

    const meta = {};
    if (flags.length) meta.flags = flags;

    return allocSlot(kernel, allIns, params, meta);
  }

  function lowerVariadic(op, inputRefs, kwargs) {
    // Chain into binary pairs left-to-right.
    // (mix a b c d) -> mix2(mix2(a,b), mix2(c,d))
    const kernel = opToKernel(op) + '2';
    let refs = inputRefs;
    while (refs.length > 2) {
      const next = [];
      for (let i = 0; i < refs.length; i += 2) {
        if (i + 1 < refs.length) {
          const pairParams = {};
          for (const [k, v] of Object.entries(kwargs)) {
            if (v.t === 'num') pairParams[k] = v.v;
          }
          const flags = Object.entries(kwargs).filter(([, v]) => v.t === 'flag').map(([k]) => k);
          const meta = flags.length ? { flags } : {};
          next.push(allocSlot(kernel, [refs[i], refs[i + 1]], pairParams, meta));
        } else {
          next.push(refs[i]); // odd one out passes through
        }
      }
      refs = next;
    }
    // Final pair.
    const pairParams = {};
    for (const [k, v] of Object.entries(kwargs)) {
      if (v.t === 'num') pairParams[k] = v.v;
    }
    const flags = Object.entries(kwargs).filter(([, v]) => v.t === 'flag').map(([k]) => k);
    const meta = flags.length ? { flags } : {};
    return allocSlot(kernel, refs.slice(0, 2), pairParams, meta);
  }

  function lowerLens(node) {
    if (bufMemo.has(node)) return bufMemo.get(node);
    const seed = node.items.map(item => {
      if (item.t === 'num') return item.v;
      return 0;
    });
    const ref = allocBuffer('lens', seed.length, seed);
    bufMemo.set(node, ref);
    return ref;
  }

  // Lower a {t:'opthru', results:[node0..nodeK-1], at:atNode, clamp:bool}.
  function lowerOpThru(node) {
    const { results, at } = node;
    const K = results.length;
    const cellRefs = results.map(r => lowerNode(r));
    const rawAtRef = lowerNode(at);

    if (K === 0) return { kind: 'const', value: 0 };
    if (K === 1) return cellRefs[0];

    let atRef;
    if (node.clamp) {
      atRef = rawAtRef;
    } else {
      // Floored modulo: ((rawAt % K) + K) % K
      const kRef  = { kind: 'const', value: K };
      const mod1  = allocSlot('op_mod', [rawAtRef, kRef], {}, { state: [] });
      const addK  = allocSlot('op_add', [mod1, kRef], {}, { state: [] });
      atRef       = allocSlot('op_mod', [addK, kRef], {}, { state: [] });
    }

    function pick(refs, lo, hi) {
      if (hi - lo === 1) return refs[lo];
      const mid = (lo + hi) >> 1;
      const midRef = { kind: 'const', value: mid };
      const condRef = allocSlot('op_lt', [atRef, midRef], {}, { state: [] });
      const leftRef  = pick(refs, lo, mid);
      const rightRef = pick(refs, mid, hi);
      return allocSlot('op_if', [condRef, leftRef, rightRef], {}, { state: [] });
    }

    return pick(cellRefs, 0, K);
  }

  function lowerTape(node) {
    if (bufMemo.has(node)) return bufMemo.get(node);
    if (node.blankLen) {
      // A blank tape is a recording / wavetable buffer, so it lives in the large
      // sample pool. (The small control pool is for short literal sequences; the
      // pool is an internal detail -- the user just writes a tape.)
      const ref = allocBuffer('audio', node.blankLen);
      bufMemo.set(node, ref);
      return ref;
    }
    const seed = node.items.map(item => {
      if (item.t === 'num') return item.v;
      // _ and ~ are score rest/hold markers; they lower to 0.
      if (item.t === 'sym' && (item.s === '_' || item.s === '~')) return 0;
      if (item.t === 'sym') throw new Error(`unknown name: ${item.s}`);
      return 0;
    });
    const ref = allocBuffer('tape', seed.length, seed, node.keep);
    bufMemo.set(node, ref);
    return ref;
  }

  function lowerAudio(node) {
    if (bufMemo.has(node)) return bufMemo.get(node);
    let seconds = 1;
    if (node.seconds && node.seconds.t === 'num') seconds = node.seconds.v;
    else if (node.length && node.length.t === 'num') seconds = node.length.v / 48000;
    const length = Math.round(seconds * 48000);
    const ref = allocBuffer('audio', length);
    bufMemo.set(node, ref);
    return ref;
  }

  // Resolve a jack expression (e.g. (pulse-in :1)) to its hw jack index.
  // The jack number rides in kwargs as a flag (:1 / :2), matching the leaf
  // lowering, so read it with jackLabel rather than from positional args.
  function jackIndexOf(j) {
    if (!j) return 0;
    if (j.t === 'call' && (j.op === 'cv-in' || j.op === 'audio-in' || j.op === 'pulse-in')) {
      return JACK_INDEX[`${j.op}-${jackLabel(j.op, j.kwargs || {})}`] ?? 0;
    }
    if (j.t === 'sym') return JACK_INDEX[j.s] ?? 0;
    return 0;
  }

  // (connected JACK): reads only the connection mask (param0 = jack index), no inputs.
  function lowerConnected(node) {
    return allocSlot('op_connected', [], { param0: jackIndexOf(node.jack) }, {});
  }

  function lowerZ1(node) {
    const inRef = lowerNode(node.x);
    return allocSlot('op_z1', [inRef], {}, { state: ['last'] });
  }

  function lowerMorph(node) {
    const ins = (node.args || []).map(lowerNode).slice(0, 5);
    // param0 = input count: op_morph crossfades across its ins, needs the count up front.
    return allocSlot('op_morph', ins, { param0: ins.length }, {});
  }

  function lowerOutputsNode(node) {
    if (node.ports && node.ports.length > 0) {
      return lowerNode(node.ports[0].value);
    }
    return { kind: 'const', value: 0 };
  }

  // Resolve an output-jack sink to its terminal jack name.
  function resolveJackSink(jack, labels) {
    const valid = JACK_LABELS[jack];
    const labelKeys = labels.filter(l => !INTERP_FLAGS.has(l));
    const label = labelKeys.length ? labelKeys[0] : undefined;
    if (label === undefined || !valid.includes(label)) {
      const list = valid.map(l => `${jack} :${l}`).join(' and ');
      throw new Error(`(${jack} :${label ?? '?'}): no such jack; this module has ${list}`);
    }
    return {
      jackName: `${jack}-${label}`,
      bipolar: labels.includes('bipolar'),
      vOct:    labels.includes('v-oct'),
    };
  }

  // Direction-typed input jacks cannot be written to.
  const INPUT_JACK_OPS = new Set(['cv-in', 'audio-in', 'pulse-in', 'knob']);

  function lowerCable(cable) {
    const { sink, value, kwargs } = cable;

    if (sink.t === 'call' && INPUT_JACK_OPS.has(sink.op)) {
      const label = jackLabel(sink.op, sink.kwargs);
      throw new Error(`${sink.op} :${label} is an input, cannot write to it`);
    }
    if (sink.t === 'call' && sink.op === 'switch') {
      throw new Error(`switch :z is an input, cannot write to it`);
    }

    // Scatter sink: fan a write across a jack family, to the selected member.
    // One case of the general finite demux (see scatterGuards).
    if (sink.t === 'jackscatter') {
      const family = JACK_LABELS[sink.jack];
      const valRef = lowerNode(value);
      const guards = scatterGuards(lowerNode(sink.selector), family.length);
      for (let i = 0; i < family.length; i++) {
        const jackName = `${sink.jack}-${family[i]}`;
        const normal = jackNormals.get(jackName);
        const elseRef = normal ? lowerNode(normal) : { kind: 'const', value: 0 };
        const drive = allocSlot('op_if', [guards[i], valRef, elseRef], {}, { state: [] });
        const kernel = 'op_terminal_write_' + jackName.replace(/-/g, '_');
        const slotRef = allocSlot(kernel, [drive], {}, { state: [], jack: jackName });
        terminals.push({ jack: jackName, slotId: slotRef.id });
      }
      return;
    }

    // Output jack sink: (<- (cv-out :1) X).
    if (sink.t === 'jacksink') {
      const { jackName, bipolar, vOct } = resolveJackSink(sink.jack, sink.labels);
      if (scatterFamilies.has(sink.jack)) return;
      let valRef = lowerNode(value);
      if (sink.jack === 'cv-out' && bipolar && !vOct) {
        valRef = allocSlot('op_cv', [valRef], { param0: 1 }, { state: [] });
      }
      const kernel = 'op_terminal_write_' + jackName.replace(/-/g, '_');
      const slotRef = allocSlot(kernel, [valRef], {}, { state: [], jack: jackName });
      const mode = (sink.jack === 'cv-out' && vOct) ? 1 : 0;
      terminals.push({ jack: jackName, slotId: slotRef.id, mode });
      return;
    }

    if (sink.t === 'sym' && TERMINAL_SINKS.has(sink.s)) {
      const valRef = lowerNode(value);
      const jackSuffix = sink.s.replace(/-/g, '_');
      const kernel = 'op_terminal_write_' + jackSuffix;
      const slotRef = allocSlot(kernel, [valRef], {}, { state: [], jack: sink.s });
      terminals.push({ jack: sink.s, slotId: slotRef.id });
      return;
    }

    // Tape-bank write: (<- (thru (lens TAPES...) SEL) VAL ...) fans the write to
    // the selected tape. A thru over a buffer lens expands to a buflens-sel (the
    // tapes + index), the same node the read side distributes over. This is the
    // finite demux (scatterGuards) over memory, so :when rejoins naturally.
    if (sink.t === 'buflens-sel') {
      emitBankWrite(sink, value, kwargs);
      return;
    }

    // Seek-write sink: (<- (seek TAPE IDX) VAL) writes VAL at index IDX (random access).
    if (sink.t === 'call' && sink.op === 'seek') {
      emitSeekWrite(sink, value, kwargs);
      return;
    }

    // MIDI output sinks: side-effecting roots, no terminal push.
    if (sink.t === 'call' && (sink.op === 'midi-note-out' || sink.op === 'midi-cc-out' || sink.op === 'midi-clock-out')) {
      emitMidiOut(sink, value, kwargs);
      return;
    }

    // Buffer sink (tape / audio / lens).
    emitRecordhead(sink, value, kwargs);
  }

  // Build a random-access write slot for a (seek TAPE IDX) cable sink.
  // in0=value, in1=buffer, in2=index, in3=clock, in4=gate (param0 bit0).
  function emitSeekWrite(sink, value, kwargs) {
    const tape = sink.args[0];
    const idxRef = lowerNode(sink.args[1]);
    const valRef = lowerCableValue(value);
    const clk = kwargs.trig || (sink.kwargs && sink.kwargs.trig);
    const clkRef = clk ? lowerNode(clk) : { kind: 'const', value: 0 };
    const whenRef = kwargs.when ? lowerNode(kwargs.when) : null;

    // Seek-write into a bank: (<- (seek (thru TAPES SEL) IDX) VAL). Distribute over
    // the tapes, each gated by sel==i (and any :when), so exactly the selected tape
    // records at IDX. Same finite demux (scatterGuards) as the sequential bank write.
    if (tape.t === 'buflens-sel') {
      const tapeRefs = tape.cells.map(lowerNode);
      const guards = scatterGuards(lowerNode(tape.at), tapeRefs.length);
      for (let i = 0; i < tapeRefs.length; i++) {
        let gate = guards[i];
        if (whenRef) gate = allocSlot('op_if', [guards[i], whenRef, { kind: 'const', value: 0 }], {}, { state: [] });
        allocSlot('op_recordhead_seek', [valRef, tapeRefs[i], idxRef, clkRef, gate], { param0: 1 });
      }
      return;
    }

    // Single tape. Gate by :when if present (in4), else the plain ungated write.
    const bufRef = lowerNode(tape);
    if (whenRef) {
      allocSlot('op_recordhead_seek', [valRef, bufRef, idxRef, clkRef, whenRef], { param0: 1 });
    } else {
      const ins = [valRef, bufRef, idxRef];
      if (clk) ins.push(clkRef);
      allocSlot('op_recordhead_seek', ins, {});
    }
  }

  // MIDI output sink: emit a MIDI-out kernel slot (side-effecting root, no terminal push).
  function emitMidiOut(sink, value, kwargs) {
    const op = sink.op;
    const sinkKwargs = sink.kwargs || {};

    // Read :ch (channel 1..16 -> 0..15 internally).
    const chNode = sinkKwargs.ch || kwargs.ch;
    const ch = (chNode && chNode.t === 'num') ? ((chNode.v - 1) & 0x0F) : 0;

    if (op === 'midi-note-out') {
      const pitchRef = lowerNode(value);
      const gateNode = kwargs.gate;
      const velNode  = kwargs.vel;
      const gateRef  = gateNode ? lowerNode(gateNode) : { kind: 'const', value: 0 };
      const velRef   = velNode  ? lowerNode(velNode)  : { kind: 'const', value: 4095 };
      allocSlot('op_midi_note_out', [pitchRef, gateRef, velRef], { param0: ch });
    } else if (op === 'midi-cc-out') {
      const ccNode = sinkKwargs.cc || kwargs.cc;
      if (!ccNode || ccNode.t !== 'num') throw new Error('(midi-cc-out): :cc must be a number 0..127');
      const ccnum = ccNode.v & 0x7F;
      const valRef = lowerNode(value);
      allocSlot('op_midi_cc_out', [valRef], { param0: ch | (ccnum << 4) });
    } else if (op === 'midi-clock-out') {
      const tickRef = lowerNode(value);
      allocSlot('op_midi_clock_out', [tickRef], { param0: 0 });
    }
  }

  // Finite demux. Wrap a selector into [0,N) and return one guard per member,
  // (selector == i). The shared mechanism for any sink that fans a write across a
  // fixed set of places (a jack family, a tape bank): each place is driven/written
  // under its guard, so exactly one fires.
  function scatterGuards(selRef, N) {
    const kRef = { kind: 'const', value: N };
    const m1   = allocSlot('op_mod', [selRef, kRef], {}, { state: [] });
    const addK = allocSlot('op_add', [m1, kRef], {}, { state: [] });
    const wrap = allocSlot('op_mod', [addK, kRef], {}, { state: [] });
    const guards = [];
    for (let i = 0; i < N; i++) {
      guards.push(allocSlot('op_eq', [wrap, { kind: 'const', value: i }], {}, { state: [] }));
    }
    return guards;
  }

  // Dynamic record head: fan a write across a bank of tapes, recording into the
  // selected one. The addressing is scatterGuards (one guard per tape, sel==i);
  // the write into memory is a gated record head per tape, gated by its guard
  // and-ed with any :when. So exactly the selected tape records.
  function emitBankWrite(sink, value, kwargs) {
    const tapeRefs = sink.cells.map(lowerNode);
    const N = tapeRefs.length;
    const guards = scatterGuards(lowerNode(sink.at), N);
    const valRef = lowerCableValue(value);
    const whenRef = kwargs.when ? lowerNode(kwargs.when) : null;
    const perSample = 'per-sample' in kwargs;
    const clkRef = kwargs.trig ? lowerNode(kwargs.trig) : null;
    if (!perSample && !clkRef) {
      throw new Error('a clocked tape-bank write needs :trig (or use :per-sample)');
    }
    const lenLit = (kwargs.len && kwargs.len.t === 'num') ? kwargs.len.v : null;
    for (let i = 0; i < N; i++) {
      // gate = this tape is selected, and-ed with the optional :when.
      let gate = guards[i];
      if (whenRef) gate = allocSlot('op_if', [guards[i], whenRef, { kind: 'const', value: 0 }], {}, { state: [] });
      if (perSample) {
        allocSlot('op_recordhead_per_sample', [valRef, tapeRefs[i], gate], { param0: 1 });
      } else if (lenLit != null) {
        allocSlot('op_recordhead_len_capped_gated', [valRef, tapeRefs[i], gate, clkRef], { param0: lenLit });
      } else {
        allocSlot('op_recordhead_gated', [valRef, tapeRefs[i], gate, clkRef], {});
      }
    }
  }

  // Build a recordhead slot for a buffer-sink cable.
  function emitRecordhead(sink, value, kwargs) {
    const bufRef = lowerNode(sink);
    const kernel = recordheadKernel(kwargs);

    const preAllocatedId = nextSlotId++;
    if (bufRef && bufRef.kind === 'buffer') {
      bufToRecHeadEarly.set(bufRef.id, preAllocatedId);
    }

    const valRef = lowerCableValue(value);
    const params = {};
    for (const [k, v] of Object.entries(kwargs)) {
      if (k === 'per-sample' || k === 'reset' || v.t === 'flag' || v.t !== 'num') continue;
      params[k] = v.v;
    }
    const dynLen = kwargs.len && kwargs.len.t !== 'num' && kwargs.len.t !== 'flag';
    if (kernel === 'op_recordhead_len_capped_gated' && dynLen) {
      throw new Error('recordhead :len with :when must be a constant cap, not a stream');
    }
    const extraIns = [];
    const pushDyn = ref => { if (ref && ref.t !== 'num' && ref.t !== 'flag') extraIns.push(lowerNode(ref)); };
    pushDyn(kwargs.when);
    pushDyn(kwargs.len);
    if (kwargs.trig) extraIns.push(lowerNode(kwargs.trig));
    if (kernel === 'op_recordhead_per_sample' && 'when' in kwargs) {
      params.param0 = (params.param0 || 0) | 1;
    }
    if (extraIns.length > 2) {
      throw new Error(`recordhead has too many dynamic inputs (${2 + extraIns.length} > 5 slots)`);
    }
    const allIns = [valRef, bufRef, ...extraIns].slice(0, 5);
